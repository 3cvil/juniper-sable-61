name: build

on:
  schedule:
    # Odd minutes: GitHub drops scheduled runs under load, worst on the hour
    # (the 05:00 run of 20 Nov 2026 never fired). If these strings change,
    # change the matches in concurrency and IN_FORMAT below too.
    - cron: '17 5 * * *'
    # Backup: run.sh skips when today's release already exists.
    - cron: '43 6 * * *'
    - cron: '11 7 * * 0'
    - cron: '13 9 28-31 * *'
    # Comment runs (ci/comment.sh): every schedule starting '37 ' is one. After the
    # daily (12:00 UK), weekly (17:00) and monthly (18:00) posts, plus a late spare.
    - cron: '37 12 * * *'
    - cron: '37 15 * * *'
    - cron: '37 17 * * 0'
    - cron: '37 18 28-31 * *'
  workflow_dispatch:
    inputs:
      date:
        required: false
      channel:
        type: choice
        options: [orbit24, ai, money, football]
        default: orbit24
      format:
        type: choice
        options: [day, week, month]
        default: day
      buffer_at:
        required: false
      draft:
        type: boolean
        default: false
      fresh:
        type: boolean
        default: false
      buffer_check:
        type: boolean
        default: false
      comment:
        type: boolean
        default: false

permissions:
  contents: write

# The backup waits for a run of the same episode still going, then skips it.
concurrency:
  group: ${{ (inputs.comment || startsWith(github.event.schedule || '', '37 ')) && 'comment' || '' }}${{ inputs.channel || 'orbit24' }}-${{ inputs.format || (github.event.schedule == '11 7 * * 0' && 'week') || (github.event.schedule == '13 9 28-31 * *' && 'month') || 'day' }}-${{ inputs.date }}${{ inputs.draft && '-draft' || '' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      COMMENT_RUN: ${{ inputs.comment || startsWith(github.event.schedule || '', '37 ') }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        if: env.COMMENT_RUN != 'true'
        with:
          python-version: '3.11'
          cache: pip
      - uses: denoland/setup-deno@v2
        if: env.COMMENT_RUN != 'true'
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        if: env.COMMENT_RUN != 'true'
        with:
          path: |
            .models
            ~/.cache/huggingface
          key: m-v1
      - run: bash ci/run.sh
        env:
          IN_DATE: ${{ inputs.date }}
          IN_CHANNEL: ${{ inputs.channel }}
          CHANNELS_LIVE: ${{ vars.CHANNELS_LIVE }}
          IN_FORMAT: ${{ inputs.format || (github.event.schedule == '11 7 * * 0' && 'week') || (github.event.schedule == '13 9 28-31 * *' && 'month') || 'day' }}
          IN_BUFFER_AT: ${{ inputs.buffer_at }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_FRESH: ${{ inputs.fresh }}
          IN_BUFFER_CHECK: ${{ inputs.buffer_check }}
          IN_COMMENT: ${{ env.COMMENT_RUN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          PING_TOPIC: ${{ secrets.PING_TOPIC }}
          COOKIES: ${{ secrets.COOKIES }}
          PROXY: ${{ secrets.PROXY }}
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date +%d)" = "01" ] || exit 0
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/.keep" -q .sha 2>/dev/null || true)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.keep" -f message=update -f content="$(date +%F | base64)" ${sha:+-f sha=$sha} >/dev/null
